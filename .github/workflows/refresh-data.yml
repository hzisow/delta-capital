name: Refresh stock data

on:
  schedule:
    # Run every hour at minute 0 (UTC). Adjust if you want different cadence.
    - cron: '0 * * * *'
  workflow_dispatch:  # also runnable on-demand from the Actions UI

permissions:
  contents: write  # need to push data branch

concurrency:
  group: refresh-data
  cancel-in-progress: false  # don't kill an in-flight run if another fires

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # each run takes ~15 min; cap at 25 to be safe

    steps:
      - name: Checkout main (for the script)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install yfinance curl_cffi pandas lxml html5lib

      - name: Run fetch_data.py
        run: |
          python scripts/fetch_data.py
          ls -la data.json
          head -c 500 data.json
          echo

      - name: Push data.json to data branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save data.json out of the way before branch swap
          mv data.json /tmp/data.json

          # Check out (or create) the data branch as an orphan — it only ever
          # contains data.json, no source history. This keeps main's history clean.
          if git ls-remote --exit-code --heads origin data > /dev/null 2>&1; then
            git fetch origin data
            git checkout data
          else
            git checkout --orphan data
            git rm -rf --quiet . 2>/dev/null || true
          fi

          mv /tmp/data.json data.json
          git add data.json
          # Only commit if data actually changed
          if git diff --cached --quiet; then
            echo "No change in data.json — skipping commit"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -u origin data
          fi
