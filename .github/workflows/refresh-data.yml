name: Refresh stock data

on:
  schedule:
    # Run every hour at minute 0 (UTC). Adjust if you want different cadence.
    - cron: '0 * * * *'
  workflow_dispatch:  # also runnable on-demand from the Actions UI

permissions:
  contents: write  # need to push data branch

concurrency:
  group: refresh-data
  cancel-in-progress: false  # don't kill an in-flight run if another fires

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # each run takes ~15 min; cap at 25 to be safe

    steps:
      - name: Checkout main (for the script)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install yfinance curl_cffi pandas lxml html5lib

      - name: Run fetch_data.py
        run: |
          python scripts/fetch_data.py
          ls -la data.json
          head -c 500 data.json
          echo

      - name: Pull existing picks_history.json from data branch (if any)
        run: |
          # If picks_history.json already exists on the data branch, grab it
          # so save_picks.py can append to it.
          if git ls-remote --exit-code --heads origin data > /dev/null 2>&1; then
            git fetch origin data
            git show origin/data:picks_history.json > picks_history.json 2>/dev/null || true
          fi
          ls -la picks_history.json 2>/dev/null || echo "no existing history yet"

      - name: Run save_picks.py (weekly forward-test snapshot)
        run: |
          python scripts/save_picks.py
          ls -la picks_history.json 2>/dev/null || echo "no history file produced"

      - name: Push data.json + picks_history.json to data branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save outputs before branch swap
          mv data.json /tmp/data.json
          [ -f picks_history.json ] && mv picks_history.json /tmp/picks_history.json

          # Check out (or create) the data branch as an orphan
          if git ls-remote --exit-code --heads origin data > /dev/null 2>&1; then
            git fetch origin data
            git checkout data
          else
            git checkout --orphan data
            git rm -rf --quiet . 2>/dev/null || true
          fi

          mv /tmp/data.json data.json
          [ -f /tmp/picks_history.json ] && mv /tmp/picks_history.json picks_history.json

          git add data.json
          [ -f picks_history.json ] && git add picks_history.json

          if git diff --cached --quiet; then
            echo "No change — skipping commit"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -u origin data
          fi
